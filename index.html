<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The best way to play Super Mario 64 on the go!" />
  <meta name="robots" content="noindex" />
  <title>Super Mario 64 on the Web!</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      image-rendering: pixelated;
      scrollbar-width: none;
    }

    ::-webkit-scrollbar {
      display: none;
    }

    #container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      outline: none;
      border: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas class="emscripten" id="canvas" tabindex="0"></canvas>
  </div>

  <script>
    var Module = {
      preRun: [],
      postRun: [],
      elementPointerLock: true,

      print: (function () {
        return function (text) {
          if (arguments.length > 1) {
            text = Array.prototype.slice.call(arguments).join(" ");
          }
          console.log(text);
        };
      })(),

      printErr: function (text) {
        if (arguments.length > 1) {
          text = Array.prototype.slice.call(arguments).join(" ");
        }
        console.error(text);
      },

      canvas: (function () {
        var canvas = document.getElementById("canvas");

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }

        function focusCanvas() {
          try {
            canvas.focus();
          } catch (e) {}
        }

        function lockPointer() {
          try {
            if (document.pointerLockElement !== canvas && canvas.requestPointerLock) {
              canvas.requestPointerLock();
            }
          } catch (e) {}
        }

        resizeCanvas();
        canvas.style.outline = "none";

        canvas.addEventListener("webglcontextlost", function (e) {
          alert("WebGL context lost. You will need to reload the page.");
          e.preventDefault();
        }, false);

        canvas.addEventListener("click", function () {
          focusCanvas();
          lockPointer();
        }, true);

        canvas.addEventListener("mousedown", function () {
          focusCanvas();
        }, true);

        canvas.addEventListener("mouseup", function () {
          focusCanvas();
        }, true);

        canvas.addEventListener("mouseenter", function () {
          focusCanvas();
        }, true);

        window.addEventListener("load", function () {
          resizeCanvas();
          focusCanvas();
        });

        window.addEventListener("resize", function () {
          resizeCanvas();
          focusCanvas();
        });

        window.addEventListener("keydown", function () {
          focusCanvas();
        }, true);

        document.addEventListener("pointerlockchange", function () {
          if (document.pointerLockElement === canvas) {
            focusCanvas();
          }
        });

        return canvas;
      })(),

      setStatus: function (text) {}
    };
  </script>

  <script async src="sm64.us.f3dex2e.js"></script>
</body>
</html>
